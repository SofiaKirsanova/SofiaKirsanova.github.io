</g>
<text x="313" y="107" font-size="13" fill="#29506b" font-weight="700">02 · Mask guidance</text>
<rect x="313" y="116" width="198" height="191" rx="7" fill="#e8f0f4"/>
<path d="M329 284 Q355 254 382 244 T443 199 T496 137" stroke="#52b3a0" stroke-width="15" fill="none" opacity=".4" stroke-linecap="round"/>
