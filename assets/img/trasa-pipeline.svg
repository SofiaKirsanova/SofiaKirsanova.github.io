<rect x="34" y="116" width="221" height="191" fill="url(#paper)"/><rect x="34" y="116" width="221" height="191" fill="url(#grain)"/>
<g stroke="#bc9a73" stroke-width="1.8" opacity=".75" fill="none">
<path d="M19 138 Q60 118 78 145 T142 149 T220 143 T270 155"/>
