<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc">
<title id="title">TRASA conceptual pipeline</title>
<desc id="desc">A scanned map patch is combined with segmentation guidance, passed through a graph transformer with node-type classification, and converted to a connected road graph. Conceptual schematic, not an experiment result.</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3eedb"/><stop offset="1" stop-color="#e5dfca"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f5f9fc"/></linearGradient>
  <pattern id="grain" width="23" height="19" patternUnits="userSpaceOnUse"><circle cx="3" cy="7" r=".6" fill="#5d736f" opacity=".26"/><circle cx="16" cy="13" r=".8" fill="#846b55" opacity=".23"/></pattern>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7593a7"/></marker>
  <clipPath id="mapclip"><rect x="34" y="100" width="221" height="206" rx="8"/></clipPath>
</defs>
<rect width="1100" height="390" fill="#f9fbfc"/>
<g font-family="Inter, Arial, sans-serif">
<text x="35" y="35" font-weight="700" font-size="20" fill="#233549">TRASA · from map pixels to road graphs</text>
<text x="35" y="59" font-size="13" fill="#647689">Method overview · schematic, not model output</text>
<g fill="url(#panel)" stroke="#d7e2e9" stroke-width="1.5"><rect x="19" y="81" width="251" height="267" rx="12"/><rect x="295" y="81" width="235" height="267" rx="12"/><rect x="556" y="81" width="243" height="267" rx="12"/><rect x="826" y="81" width="255" height="267" rx="12"/></g>
